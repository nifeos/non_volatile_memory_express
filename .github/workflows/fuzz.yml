name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: nifeos/crate-workflows/.github/workflows/fuzz.yml@7f3d18814b605eac7c2dcf6d161e7a9516cf77d0
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: false
