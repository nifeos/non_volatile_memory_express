[package]
name = "non_volatile_memory_express"
version = "0.1.0-pre.1"
edition = "2024"
rust-version = "1.85"
description = "NVMe queue mechanics as pure logic: command building, ring arithmetic, doorbells, PRP pairs and identify parsing, proven with Kani"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/non_volatile_memory_express"
readme = "README.md"
keywords = ["no-std", "nvme", "storage", "kani", "driver"]
categories = ["no-std", "embedded", "hardware-support"]
publish = false     # held until the maintainers decide the first release
# What a user of the crate needs: the source, the falsification patches that make each proof fail,
# and the documents. The continuous integration files stay in the repository.
include = ["src/**", "falsifications/**", "README.md", "CHANGELOG.md", "LICENSE-*", "Cargo.toml"]

# no_std for an operating system kernel, std for host tests. The crate owns the NVMe queue
# mechanics only (register field decode, command building, submission and completion ring
# arithmetic with the phase tag, doorbell addressing, Physical Region Page construction, identify
# parsing); the caller supplies the volatile memory-mapped input/output accessors and the direct
# memory access memory, so all of this tests on the host in milliseconds and is reachable by the
# model checker.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
